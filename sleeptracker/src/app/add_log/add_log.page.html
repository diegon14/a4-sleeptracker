<ion-header [translucent]="true">
  <ion-toolbar>
    <ion-buttons slot="start">
        <ion-button (click)="cancel()">Cancel</ion-button>
    </ion-buttons>

    <ion-title>New Log</ion-title>

    <ion-buttons slot="end">
        <ion-button (click)="logOvernight()" [strong]="true">Submit</ion-button>
    </ion-buttons>
  </ion-toolbar>
</ion-header>

    
    <section id="night_sleep">
        <h1>{{log_date_string}}</h1>
        <h2>Night Sleep</h2>
        <div id="night_sleep_selectors">
            
            <div id="bed_time_selector" class="time_selector">
                <p>Bed Time: </p>
                <ion-datetime (ionChange)="onDateChange($event)" presentation="date-time" [preferWheel]="true" [(ngModel)]="bed_time_ISO" [max]="log_date_ISO"></ion-datetime>
            </div>
            <hr>
            <div id="awake_time_selector" class="time_selector">
                <p>Wake up time: </p>
                <ion-datetime (ionChange)="onDateChange($event)" presentation="date-time" [preferWheel]="true" [(ngModel)]="log_date_ISO" [min]="bed_time_ISO"></ion-datetime>
            </div>
        
        </div>
        <h2 id="rest_time">Total Rest: {{rest_time_string}} hours</h2>
    </section>
